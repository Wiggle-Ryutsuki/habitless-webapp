services:
  db:
    image: postgres:16-alpine
    container_name: habitless-db
    environment:
      POSTGRES_USER: habitless_user
      POSTGRES_PASSWORD: habitless_password
      POSTGRES_DB: habitless_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U habitless_user -d habitless_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:

